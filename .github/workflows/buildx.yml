name: buildx

on:
  schedule:
    - cron: "17 03 * * *"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  buildx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          install: true

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Docker Buildx (build)
        uses: docker/build-push-action@v7.4.0
        if: success() && github.ref_name != 'main'
        with:
          push: false
          build-args: REFRESHED_AT=$(date +%Y-%m-%d)
          platforms: linux/amd64,linux/arm64
          tags: timbru31/node-alpine-firefox:latest

      - name: Docker Login
        if: success() && github.ref_name == 'main'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Buildx (push)
        uses: docker/build-push-action@v7.4.0
        if: success() && github.ref_name == 'main'
        with:
          push: true
          build-args: REFRESHED_AT=$(date +%Y-%m-%d)
          platforms: linux/amd64,linux/arm64
          tags: timbru31/node-alpine-firefox:latest

      - name: Inspect Image
        if: always() && github.event_name != 'pull_request' && github.ref_name == 'main'
        run: |
          docker buildx imagetools inspect timbru31/node-alpine-firefox:latest

      - name: Clear
        if: always() && github.event_name != 'pull_request'
        run: |
          rm -f ${HOME}/.docker/config.json
